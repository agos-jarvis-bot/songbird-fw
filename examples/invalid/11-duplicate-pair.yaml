apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata: {name: lan}
spec: {type: physical, device: eth0}
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata: {name: wan}
spec: {type: physical, device: eth1}
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: PolicySet
metadata: {name: p1}
spec: {from: lan, to: wan, policies: []}
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: PolicySet
metadata: {name: p2}
spec: {from: lan, to: wan, policies: []}
