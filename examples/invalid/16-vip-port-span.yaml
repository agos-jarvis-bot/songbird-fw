apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata: {name: wan}
spec: {type: physical, device: eth0}
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: VirtualIP
metadata: {name: vip}
spec: {externalInterface: wan, externalAddress: 1.2.3.4, mappedAddress: 10.0.0.1, portForwarding: {protocol: tcp, externalPort: 8000-8010, mappedPort: 80}}
