apiVersion: config.songbird-fw.com/v1alpha1
kind: PolicySet
metadata:
  name: internal-to-untrusted
  comment: Office and printers going to the Internet
spec:
  from: internal
  to: untrusted
  policies:
    - name: block-printers-internet
      source: [printers]
      destination: [any]
      service: [any]
      action: drop
      log: all

    - name: lan-web-dns
      comment: Only web and DNS allowed out
      source: [grp-lan]
      destination: [any]
      service: [web, dns, ping]
      action: accept
      snat:
        enabled: true
        translateTo: outgoing-interface
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: PolicySet
metadata:
  name: untrusted-to-lan1
  comment: Published services
spec:
  from: untrusted
  to: lan1
  policies:
    - name: publish-nginx
      source: [any]
      destination: [vip-nginx-https]      # VirtualIP as destination => DNAT
      service: [https]
      action: accept

    - name: publish-k8s-api
      source: [any]
      destination: [vip-k8s-api]
      service: [k8s]
      action: accept
      log: all
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: PolicySet
metadata:
  name: lan1-to-lan2
spec:
  from: lan1
  to: lan2
  policies:
    - name: office-to-printers
      source: [lan1-subnet]
      destination: [lan2-subnet]
      service: [any]
      action: accept
      log: none
