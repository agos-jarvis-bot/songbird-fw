# yaml-language-server: $schema=../../schema/songbird.schema.json
apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata:
  name: wan
  comment: FTTH uplink
spec:
  type: physical
  device: enp1s0
  role: external
  ipv4:
    mode: static
    addresses: [78.25.11.42/30]
    gateway: 78.25.11.41
  ipv6:
    mode: dhcpv6-pd
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata:
  name: trunk
spec:
  type: physical
  device: enp2s0
  ipv4: { mode: none }
  ipv6: { mode: none }
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata:
  name: lan1
  comment: Office
spec:
  type: vlan
  parent: trunk
  vlanId: 10
  ipv4:
    mode: static
    addresses: [192.168.0.1/24]
  ipv6:
    mode: static
    addresses: [2001:db8:0:10::1/64]
    routerAdvertisement:
      enabled: true
      delegatedPrefixFrom: wan
---
apiVersion: config.songbird-fw.com/v1alpha1
kind: Interface
metadata:
  name: lan2
  comment: Printers
spec:
  type: vlan
  parent: trunk
  vlanId: 20
  ipv4:
    mode: static
    addresses: [192.168.2.1/24]
