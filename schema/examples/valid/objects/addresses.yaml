apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "lan1-subnet"
  comment: "Office subnet"
  color: "blue"
spec:
  interface: "lan1"
  subnet: "192.168.0.0/24"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "lan2-subnet"
  color: "blue"
spec:
  interface: "lan2"
  subnet: "192.168.2.0/24"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "printers"
  color: "blue"
spec:
  interface: "lan2"
  range:
    start: "192.168.2.1"
    end: "192.168.2.10"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "mgmt-laptop"
  comment: "Agos' workstation (DHCP reservation)"
spec:
  interface: "lan1"
  subnet: "192.168.0.50/32"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "win-pc"
  comment: "Match by MAC, source only"
spec:
  mac: "34:29:8f:74:f4:6a"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "google"
spec:
  fqdn: "www.google.com"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "veeam-server"
  color: "green"
spec:
  interface: "lan1"
  subnet: "192.168.0.40/32"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "nginx"
  comment: "Public web server in the DMZ"
  color: "red"
spec:
  interface: "dmz"
  subnet: "192.168.30.20/32"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "k8s-api"
  color: "k8s-blue"
spec:
  interface: "lan1"
  subnet: "192.168.0.25/32"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata:
  name: "wan-ip"
  comment: "Our static public address (DNAT target match / SNAT pool)"
  color: "orange"
spec:
  interface: "wan"
  subnet: "78.25.11.42/32"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "AddressGroup"
metadata:
  name: "grp-lan"
  comment: "Everything in the office network"
  color: "blue"
spec:
  members: ["lan1-subnet", "printers"]
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "AddressGroup"
metadata:
  name: "grp-backup"
  color: "green"
spec:
  members: ["veeam-server"]
