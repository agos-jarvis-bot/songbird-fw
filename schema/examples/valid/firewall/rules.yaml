# One RuleSet per (from, to) pair. Order = position in spec.rules, first match wins.
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata:
  name: "internal-to-untrusted"
  comment: "Office and printers going to the Internet"
spec:
  from: "internal"
  to: "untrusted"
  rules:
    - name: "block-printers-internet"
      source: ["printers"]
      destination: ["any"]
      service: ["any"]
      action: "drop"
      log: "all"

    - name: "lan-web-dns"
      comment: "Only web, DNS and ping allowed out; masquerade to the WAN address"
      source: ["grp-lan"]
      destination: ["any"]
      service: ["web", "dns", "ping"]
      action: "accept"
      nat:
        type: "snat"              # translateIpTo omitted => outgoing interface address

    - name: "block-google-fqdn"
      comment: "FQDN Addresses are not supported by the Data Plane yet (R-012.4): kept disabled"
      enabled: false
      source: ["grp-lan"]
      destination: ["google"]
      service: ["any"]
      action: "drop"

    - name: "k8s-egress-fixed-ip"
      comment: "Cluster egress pinned to our static IP (IP pool = Address)"
      source: ["k8s-api"]
      destination: ["any"]
      service: ["any"]
      action: "accept"
      nat:
        type: "snat"
        translateIpTo: "wan-ip"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata:
  name: "untrusted-to-dmz"
  comment: "Published services (DNAT)"
spec:
  from: "untrusted"
  to: "dmz-zone"
  rules:
    - name: "publish-nginx"
      comment: "Public 443 -> nginx:8443"
      source: ["any"]
      destination: ["wan-ip"]          # matched BEFORE translation
      service: ["https"]
      action: "accept"
      nat:
        type: "dnat"
        translateIpTo: "nginx"
        translateServiceTo: "https-8443"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata:
  name: "untrusted-to-lan1"
spec:
  from: "untrusted"
  to: "lan1"
  rules:
    - name: "publish-k8s-api"
      comment: "Port unchanged: translateServiceTo omitted"
      source: ["any"]
      destination: ["wan-ip"]
      service: ["k8s-api"]
      action: "accept"
      log: "all"
      nat:
        type: "dnat"
        translateIpTo: "k8s-api"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata:
  name: "lan1-to-lan2"
spec:
  from: "lan1"
  to: "lan2"
  rules:
    - name: "office-to-printers"
      source: ["lan1-subnet"]
      destination: ["lan2-subnet"]
      service: ["any"]
      action: "accept"
      log: "none"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata:
  name: "dmz-to-internal"
  comment: "Backup traffic from the DMZ to the Veeam server only"
spec:
  from: "dmz-zone"
  to: "internal"
  rules:
    - name: "dmz-backup"
      source: ["nginx"]
      destination: ["grp-backup"]
      service: ["veeam"]
      action: "accept"
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata:
  name: "dmz-to-untrusted"
  comment: "Empty on purpose: the DMZ has no Internet access (explicit, not just Default Deny)"
spec:
  from: "dmz-zone"
  to: "untrusted"
  rules: []
