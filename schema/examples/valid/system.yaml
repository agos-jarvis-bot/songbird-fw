# yaml-language-server: $schema=../../songbird.schema.json
# Global settings — FortiGate "config system global / admin / ntp / dns / session-ttl", "config log".
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "System"
metadata:
  name: "system"
  comment: "Head office firewall"
spec:
  hostname: "fw01.example.lan"
  timezone: "Europe/Rome"

  admin:
    httpsPort: 8443
    redirectHttp: true
    sessionTimeout: "8h"
    lockout:
      threshold: 5
      duration: "10m"
    trustedHosts: ["lan1-subnet", "mgmt-laptop"]
    certificate:
      mode: "acme-dns01"
      acme:
        email: "noc@example.com"
        domains: ["fw01.example.com"]
        dnsProvider: "cloudflare"
        dnsCredentials: "ENC[age:YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0-IFgyNTUxOSBjbG91ZGZsYXJlCg==]"
        renewBeforeDays: 30
    ui:
      theme: "dark"
      language: "en"

  systemServices:
    ntp:
      enabled: true
      servers: ["0.it.pool.ntp.org", "1.it.pool.ntp.org"]
      listenOn: ["internal"]

    dns:
      mode: "forwarder"
      upstreams: ["9.9.9.9", "149.112.112.112"]
      failoverAfterTimeouts: 3
      localDomain: "example.lan"
      localRecords:
        - { name: "nas", address: "192.168.0.30" }
        - { name: "printer-hall", address: "192.168.2.5" }
      dns64: true
      listenOn: ["internal"]

    dhcp:
      lan1:
        range: { start: "192.168.0.100", end: "192.168.0.199" }
        leaseTime: "12h"
        domain: "example.lan"
        # dnsServers/gateway omitted => the firewall's own address on lan1 (lan1 is in dns.listenOn via "internal")
        reservations:
          - { mac: "34:29:8f:74:f4:6a", address: "192.168.0.50", hostname: "mgmt-laptop" }
          - { mac: "b8:27:eb:12:34:56", address: "192.168.0.30", hostname: "nas" }
      lan2:
        range: { start: "192.168.2.50", end: "192.168.2.200" }
        leaseTime: "7d"
        dnsServers: ["192.168.2.1"]        # firewall itself; lan2 is in "internal" => coherent with dns.listenOn
        ntpServers: ["192.168.2.1"]        # ntp.listenOn also has "internal"

  logging:
    directory: "/var/lib/songbird/log"
    rotation:
      maxFileSizeMb: 100
      retentionDays: 90
      compress: true
    anonymizeSourceIp:
      enabled: true
      interfaces: ["lan1", "lan2"]
      ipv4MaskBits: 8
      ipv6MaskBits: 80
    syslog:
      enabled: true
      server: "siem.example.lan"
      port: 6514
      transport: "tls"
      facility: "local4"

  session:
    timeouts:
      tcpEstablished: "1h"
      tcpHandshake: "30s"
      tcpClosing: "10s"
      udp: "60s"
      udpBidirectional: "180s"
      icmp: "30s"
    maxSessions: 1000000
    ipv4NonInitialFragments: "drop"
    onRuleChange: "terminate"

  nat64:
    enabled: true
    prefix: "64:ff9b::/96"

  git:
    enabled: true
    remote: "git@github.com:example-org/fw01-config.git"
    branch: "main"
    autoPush: true
    pullInterval: "60s"
    retryInterval: "60s"
    auth:
      type: "ssh-key"
      sshPrivateKey: "ENC[age:YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0-IFgyNTUxOSBzc2gta2V5Cg==]"

  updates:
    channel: "stable"
    automatic: true
    window: "03:00-05:00"

  threatFeeds:
    enabled: true
    refreshInterval: "1h"
    sources:
      - { name: "feodo", url: "https://feodotracker.abuse.ch/downloads/ipblocklist.txt" }
      - { name: "sslbl", url: "https://sslbl.abuse.ch/blacklist/sslipblacklist.txt", enabled: false }
