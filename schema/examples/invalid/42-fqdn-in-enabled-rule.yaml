apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Interface"
metadata: { name: "lan" }
spec: { type: "physical", device: "eth0" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Interface"
metadata: { name: "wan" }
spec: { type: "physical", device: "eth1" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata: { name: "g" }
spec: { fqdn: "www.example.com" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata: { name: "p" }
spec:
  from: "lan"
  to: "wan"
  rules:
    - { name: "x", source: ["any"], destination: ["g"], service: ["any"], action: "accept" }
