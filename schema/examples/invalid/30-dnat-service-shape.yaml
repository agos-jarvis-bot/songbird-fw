apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Interface"
metadata: { name: "lan" }
spec: { type: "physical", device: "eth0" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Interface"
metadata: { name: "wan" }
spec: { type: "physical", device: "eth1" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata: { name: "pub" }
spec: { subnet: "1.2.3.4/32" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Address"
metadata: { name: "srv" }
spec: { subnet: "10.0.0.1/32" }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Service"
metadata: { name: "https" }
spec: { protocols: [{ protocol: "tcp", port: 443 }] }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "Service"
metadata: { name: "multi" }
spec: { protocols: [{ protocol: "tcp", port: "8000-8010" }] }
---
apiVersion: "config.songbird-fw.com/v1alpha1"
kind: "RuleSet"
metadata: { name: "p" }
spec:
  from: "wan"
  to: "lan"
  rules:
    - { name: "x", source: ["any"], destination: ["pub"], service: ["https"], action: "accept", nat: { type: "dnat", translateIpTo: "srv", translateServiceTo: "multi" } }
